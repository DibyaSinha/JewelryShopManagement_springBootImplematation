<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandi Fashion — Jewelry Management</title>
    <link rel="icon" type="image/png" href="images/CF_LOGO1.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div id="login-container" class="auth-container">
    <div class="auth-card">
        <div class="brand-header">
            <img src="images/logo.png" alt="Chandi Fashion Logo" class="brand-logo">
        </div>
        <p>Sign in to manage inventory, billing and staff</p>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Enter your username" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
                    <i class="fas fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>
            </div>
            <button type="submit" class="btn-primary">Sign in</button>
        </form>
        <div id="login-message" class="message"></div>
    </div>
</div>

<div id="app-container" class="hidden">
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="images/logo.png" alt="Chandi Fashion Logo" class="innerBrand-logo">
        </div>
        <nav class="sidebar-nav">
            <ul id="sidebar-menu">
                <!-- Dynamic menu based on role -->
            </ul>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info" id="user-info">
                <div>
                    <span id="user-display-name">User</span><br>
                    <span id="user-role" class="badge">Role</span>
                </div>
            </div>
            <button id="logout-btn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> <span>Sign out</span></button>
        </div>
    </aside>

    <main class="content">
        <header class="content-header">
            <h2 id="view-title">Dashboard</h2>
            <div id="today-rates-bar" class="rates-bar">
                <!-- Rates injected here -->
            </div>
        </header>

        <section id="view-content" class="view-section">
            <!-- View content injected here -->
        </section>
    </main>
</div>

<div id="modal-container" class="modal hidden">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
